<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="skyRadial" cx="30%" cy="60%" r="75%">
      <stop offset="0%" stop-color="#c5f3fc" />
      <stop offset="45%" stop-color="#e8faff" />
      <stop offset="90%" stop-color="#ffffff" />
    </radialGradient>
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b1820" />
      <stop offset="65%" stop-color="#a31d27" />
      <stop offset="85%" stop-color="#38bdf8" />
      <stop offset="95%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#a3e635" />
    </linearGradient>
    <linearGradient id="woodVertical" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b1d0c" />
      <stop offset="25%" stop-color="#6e3919" />
      <stop offset="60%" stop-color="#99562a" />
      <stop offset="85%" stop-color="#693718" />
      <stop offset="100%" stop-color="#341808" />
    </linearGradient>
    <linearGradient id="woodHorizontal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8c4e25" />
      <stop offset="35%" stop-color="#b46a36" />
      <stop offset="70%" stop-color="#663517" />
      <stop offset="100%" stop-color="#3b1d0c" />
    </linearGradient>
    <linearGradient id="leafGradTop" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="30%" stop-color="#4ade80" />
      <stop offset="70%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>
    <linearGradient id="leafGradBot" x1="0%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#bbf7d0" />
      <stop offset="40%" stop-color="#22c55e" />
      <stop offset="80%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>
    <linearGradient id="leafGradMid" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#86efac" />
      <stop offset="50%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#166534" />
    </linearGradient>
  </defs>

  <!-- Circular Badge -->
  <circle cx="310" cy="245" r="185" fill="url(#skyRadial)" stroke="url(#rimGrad)" stroke-width="12" />
  <circle cx="310" cy="245" r="176" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.75" />

  <!-- Wooden Cross -->
  <rect x="25" y="188" width="350" height="30" rx="3" fill="url(#woodHorizontal)" />
  <rect x="175" y="32" width="44" height="446" rx="3" fill="url(#woodVertical)" />
  <rect x="175" y="32" width="5" height="446" fill="#ffffff" opacity="0.18" />
  <rect x="25" y="188" width="350" height="3" fill="#ffffff" opacity="0.22" />

  <!-- Typography Inside Badge -->
  <text x="332" y="126" font-family="Impact, 'Arial Black', sans-serif" font-weight="900" font-size="50" fill="#0f172a" text-anchor="middle" letter-spacing="1.5">QUEZON</text>

  <g>
    <text x="355" y="180" font-family="'Brush Script MT', 'Segoe Script', 'Lucida Handwriting', cursive, sans-serif" font-style="italic" font-weight="bold" font-size="48" fill="none" stroke="#ffffff" stroke-width="6" stroke-linejoin="round" text-anchor="middle">New Life</text>
    <text x="355" y="180" font-family="'Brush Script MT', 'Segoe Script', 'Lucida Handwriting', cursive, sans-serif" font-style="italic" font-weight="bold" font-size="48" fill="#14532d" text-anchor="middle">New Life</text>
  </g>

  <text x="332" y="262" font-family="Impact, 'Arial Black', sans-serif" font-weight="900" font-size="48" fill="#0f172a" text-anchor="middle" letter-spacing="0.8">BAPTIST</text>
  <text x="332" y="308" font-family="Impact, 'Arial Black', sans-serif" font-weight="900" font-size="48" fill="#0f172a" text-anchor="middle" letter-spacing="0.8">CHURCH</text>

  <!-- Sprouting Leaves with Dew Drops -->
  <g>
    <path d="M 138 165 C 102 185 64 240 85 292 C 112 342 165 305 152 248 C 146 215 150 180 138 165 Z" fill="url(#leafGradTop)" stroke="#166534" stroke-width="2.5" />
    <path d="M 138 170 Q 120 235 106 290" fill="none" stroke="#bbf7d0" stroke-width="2.5" />
    <ellipse cx="100" cy="222" rx="4.5" ry="6" fill="#ffffff" opacity="0.85" />
    <circle cx="120" cy="272" r="5" fill="#ffffff" opacity="0.85" />
  </g>

  <g>
    <path d="M 152 290 C 175 315 200 370 178 405 C 150 435 130 380 138 335 Z" fill="url(#leafGradMid)" stroke="#166534" stroke-width="2" />
    <circle cx="162" cy="358" r="4" fill="#ffffff" opacity="0.85" />
  </g>

  <g>
    <path d="M 148 335 C 100 330 30 350 2 410 C 52 445 130 412 150 360 Z" fill="url(#leafGradBot)" stroke="#166534" stroke-width="2.5" />
    <ellipse cx="78" cy="374" rx="5" ry="4" fill="#ffffff" opacity="0.85" />
    <circle cx="98" cy="386" r="3.5" fill="#ffffff" opacity="0.85" />
  </g>

  <!-- Open Bible with Galatians 2:20 -->
  <g>
    <path d="M 305 418 Q 232 396 150 424 L 202 322 Q 256 306 305 322 Q 354 306 438 322 L 488 420 Q 388 395 305 418 Z" fill="#ffffff" stroke="#000000" stroke-width="4.5" stroke-linejoin="round" />
    <path d="M 150 424 L 140 420 L 195 318 L 202 322 Z" fill="#e2e8f0" stroke="#000000" stroke-width="2.5" />
    <path d="M 150 424 Q 232 396 305 418" fill="none" stroke="#000000" stroke-width="3.5" />
    <line x1="305" y1="322" x2="305" y2="418" stroke="#000000" stroke-width="4" />
    <path d="M 488 420 L 496 415 L 442 318 L 438 322 Z" fill="#e2e8f0" stroke="#000000" stroke-width="2.5" />
    <path d="M 305 418 Q 388 395 488 420" fill="none" stroke="#000000" stroke-width="3.5" />
    <path d="M 292 420 Q 305 430 318 420" fill="#000000" stroke="#000000" stroke-width="2.5" />
    <text x="396" y="375" font-family="Impact, 'Arial Black', sans-serif" font-weight="900" font-style="italic" font-size="17" fill="#000000" text-anchor="middle" transform="rotate(-3 396 375)" letter-spacing="0.5">GALATIANS 2:20</text>
  </g>
</svg>
