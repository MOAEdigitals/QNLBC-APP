<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="skyGrad" cx="35%" cy="65%" r="70%">
      <stop offset="0%" stop-color="#b6f0fa" />
      <stop offset="50%" stop-color="#e1f8fc" />
      <stop offset="100%" stop-color="#ffffff" />
    </radialGradient>

    <!-- Wood Cross Gradient (Vertical) -->
    <linearGradient id="woodVert" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a2611" />
      <stop offset="35%" stop-color="#733d1d" />
      <stop offset="70%" stop-color="#965529" />
      <stop offset="100%" stop-color="#3d1d0c" />
    </linearGradient>

    <!-- Wood Cross Gradient (Horizontal) -->
    <linearGradient id="woodHoriz" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8a4d25" />
      <stop offset="50%" stop-color="#693719" />
      <stop offset="100%" stop-color="#42200d" />
    </linearGradient>

    <!-- Leaf 1 Gradient -->
    <linearGradient id="leafGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86efac" />
      <stop offset="40%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>

    <!-- Leaf 2 Gradient -->
    <linearGradient id="leafGrad2" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="50%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>

    <!-- Drop Shadow for Bible and Cross -->
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- 1. Circular Badge Outer Ring -->
  <circle cx="280" cy="245" r="190" fill="url(#skyGrad)" stroke="#8b1d24" stroke-width="8" />

  <!-- Inner Subtle Ring -->
  <circle cx="280" cy="245" r="185" fill="none" stroke="#22d3ee" stroke-width="1.5" opacity="0.6" />

  <!-- 2. The Wooden Cross -->
  <!-- Horizontal Beam -->
  <rect x="25" y="190" width="335" height="28" rx="2" fill="url(#woodHoriz)" />
  <!-- Vertical Beam -->
  <rect x="168" y="38" width="42" height="435" rx="2" fill="url(#woodVert)" />

  <!-- 3. Church Name Typography (Inside Circle) -->
  <!-- "QUEZON" -->
  <text x="305" y="130" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="44" fill="#000000" text-anchor="middle" letter-spacing="1">QUEZON</text>

  <!-- "New Life" in cursive green -->
  <text x="340" y="180" font-family="'Brush Script MT', 'Segoe Script', 'Lucida Handwriting', cursive" font-style="italic" font-weight="bold" font-size="46" fill="#14532d" text-anchor="middle">New Life</text>

  <!-- "BAPTIST" -->
  <text x="310" y="265" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="44" fill="#000000" text-anchor="middle" letter-spacing="0.5">BAPTIST</text>

  <!-- "CHURCH" -->
  <text x="310" y="310" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="44" fill="#000000" text-anchor="middle" letter-spacing="0.5">CHURCH</text>

  <!-- 4. Three Fresh Green Leaves with Dew Drops on the Left -->
  <!-- Top Center Leaf -->
  <path d="M 135 170 C 105 190 70 240 90 290 C 115 340 160 300 150 250 C 145 220 148 185 135 170 Z" fill="url(#leafGrad1)" stroke="#166534" stroke-width="2" />
  <!-- Center vein -->
  <path d="M 135 175 Q 120 235 110 290" fill="none" stroke="#86efac" stroke-width="2" />
  <!-- Side veins -->
  <path d="M 126 215 Q 105 220 98 235 M 122 245 Q 140 250 145 265 M 117 265 Q 100 275 95 285" fill="none" stroke="#86efac" stroke-width="1" opacity="0.8" />
  <!-- Water droplets on top leaf -->
  <ellipse cx="102" cy="225" rx="3.5" ry="5" fill="#ffffff" opacity="0.75" />
  <circle cx="125" cy="275" r="4" fill="#ffffff" opacity="0.75" />
  <circle cx="126" cy="276" r="2.5" fill="#e0f2fe" opacity="0.9" />

  <!-- Bottom Left Leaf -->
  <path d="M 145 330 C 100 325 35 345 2 405 C 50 435 125 405 145 355 Z" fill="url(#leafGrad2)" stroke="#166534" stroke-width="2" />
  <!-- Bottom Center vein -->
  <path d="M 145 332 Q 80 365 5 403" fill="none" stroke="#86efac" stroke-width="2" />
  <!-- Droplet on bottom leaf -->
  <circle cx="80" cy="370" r="4.5" fill="#ffffff" opacity="0.8" />
  <circle cx="95" cy="380" r="3" fill="#ffffff" opacity="0.8" />

  <!-- 5. The Open Bible at the Bottom -->
  <g filter="url(#softShadow)">
    <!-- Base Bible Shape / Pages background -->
    <path d="M 280 415 Q 215 395 150 422 L 195 325 Q 240 310 280 325 Q 320 310 395 325 L 442 420 Q 370 395 280 415 Z" fill="#ffffff" stroke="#000000" stroke-width="4" stroke-linejoin="round" />
    
    <!-- Left Page lines & thickness -->
    <path d="M 150 422 L 142 418 L 190 322 L 195 325 Z" fill="#e2e8f0" stroke="#000000" stroke-width="2.5" />
    <path d="M 150 422 Q 215 395 280 415" fill="none" stroke="#000000" stroke-width="3" />
    <path d="M 195 325 Q 240 310 280 325" fill="none" stroke="#000000" stroke-width="2" />
    
    <!-- Spine Center Divider -->
    <line x1="280" y1="325" x2="280" y2="415" stroke="#000000" stroke-width="3.5" />

    <!-- Right Page lines & thickness -->
    <path d="M 442 420 L 448 415 L 398 322 L 395 325 Z" fill="#e2e8f0" stroke="#000000" stroke-width="2.5" />
    <path d="M 280 415 Q 370 395 442 420" fill="none" stroke="#000000" stroke-width="3" />
    <path d="M 280 325 Q 320 310 395 325" fill="none" stroke="#000000" stroke-width="2" />

    <!-- Book Bottom Spine Arc -->
    <path d="M 268 416 Q 280 426 292 416" fill="#000000" stroke="#000000" stroke-width="2" />

    <!-- "GALATIANS 2:20" on Right Page -->
    <text x="355" y="375" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-style="italic" font-size="14" fill="#000000" text-anchor="middle" transform="rotate(-3 355 375)">GALATIANS 2:20</text>
  </g>
</svg>
