name: Check assignment notifications
on:
  push:
    branches: ['main', 'feature/android-assignment-notifications']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: notifications-test-only
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: notifications-test-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify migration and assignment flows in isolated PostgreSQL
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f test/assignment_schema_fixture.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20261025031548_assignment_notifications.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20261025162229_admin_announcements.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20261025162408_private_announcement_operations.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20261026012319_narrow_announcement_admin_endpoints.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f test/assignment_notifications.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f test/admin_announcements.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f test/personal_notes_ci_fixture.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20261026065130_personal_notepad.sql
          sed '/^select cron.schedule/d' supabase/migrations/20261026065759_calendar_notification_reminders.sql | psql -h localhost -U postgres -v ON_ERROR_STOP=1
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f test/personal_notes_and_reminders.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20261028171857_security_hardening.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f test/security_hardening.sql
  android:
    needs: [app, database]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm run build:android
      - name: Compile Android notification integration
        working-directory: android
        run: chmod +x ./gradlew && ./gradlew assembleDebug
